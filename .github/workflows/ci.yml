name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        # Credenciales efímeras del contenedor de CI: no son secretos ni existen fuera de este job.
        env:
          POSTGRES_DB: calles_seguras_test
          POSTGRES_USER: csj_ci
          POSTGRES_PASSWORD: csj_ci_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csj_ci -d calles_seguras_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Las pruebas de integración sólo corren contra una base cuyo nombre termina en _test (conftest.py).
      DATABASE_URL: postgresql+psycopg://csj_ci:csj_ci_local@127.0.0.1:5432/calles_seguras_test
      APP_ENV: test
      JWT_SECRET_KEY: clave-de-pruebas-ci-no-secreta-1234567890
      SEED_PASSWORD: PruebasCi2026
      FRONTEND_URL: http://localhost:5173
      # Las pruebas sustituyen al proveedor de geocodificación; sin llave se usa el catálogo local.
      GEOCODING_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Aplicar migraciones
        run: alembic -c db/alembic.ini upgrade head

      - name: Cargar datos semilla
        run: python db/seed.py

      - name: Ejecutar pruebas
        shell: bash
        run: |
          set -o pipefail
          python -m pytest backend/tests -q -rs | tee pytest.log
          # conftest.py omite las pruebas si no hay PostgreSQL: en CI eso debe fallar, no pasar en verde.
          if grep -q "skipped" pytest.log; then
            echo "::error::Se omitieron pruebas; revisa la conexión a PostgreSQL."
            exit 1
          fi

  dependencias:
    # OWASP Top 10:2025 A03 (fallas en la cadena de suministro de software): el pipeline falla si alguna
    # dependencia fijada tiene una vulnerabilidad conocida (Python) o de severidad alta o crítica (npm).
    name: Auditoría de dependencias (OWASP A03)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auditar dependencias del backend (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Auditar dependencias del frontend (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

  # ---------------------------------------------------------------------------------------------------------------
  # Extra 4.2 — pruebas automatizadas del frontend. Se AGREGAN a los jobs anteriores (pytest, lint+build, auditoría);
  # no los reemplazan ni los debilitan.
  # ---------------------------------------------------------------------------------------------------------------
  frontend-pruebas:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Pruebas de componentes y lógica (Vitest)
        run: npm test

      - name: Conservar reporte de Vitest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reporte
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Frontend E2E (Playwright + API + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        # Credenciales efímeras del contenedor de CI: no son secretos ni existen fuera de este job.
        env:
          POSTGRES_DB: calles_seguras_e2e
          POSTGRES_USER: csj_ci
          POSTGRES_PASSWORD: csj_ci_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csj_ci -d calles_seguras_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://csj_ci:csj_ci_local@127.0.0.1:5432/calles_seguras_e2e
      APP_ENV: test
      JWT_SECRET_KEY: clave-de-pruebas-e2e-no-secreta-1234567890
      # Contraseña de las cuentas sembradas (moderador@, coordinador@, enlace@ejemplo.mx): la leen db/seed.py y Playwright.
      SEED_PASSWORD: PruebasCi2026
      # Sin llaves externas: el buscador usa el catálogo local y las rutas caen a línea recta (determinista).
      GEOCODING_API_KEY: ""
      ROUTING_API_URL: ""
      UPLOADS_DIR: ./.uploads_e2e
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Preparar la API (migraciones y datos semilla)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          alembic -c db/alembic.ini upgrade head
          python db/seed.py

      - name: Instalar el frontend y Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Pruebas E2E (Playwright levanta la API y el frontend)
        working-directory: frontend
        run: npx playwright test

      # Evidencia: el reporte HTML siempre; capturas, videos y trazas de los fallos para depurar sin repetir la corrida.
      - name: Conservar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reporte
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Conservar capturas, videos y trazas de los fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fallos
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  infraestructura:
    name: Infraestructura (Kubernetes + Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar manifiestos de infra/k8s/ (coherencia y esquema oficial de Kubernetes)
        run: |
          pip install pyyaml kubernetes-validate
          python infra/validar_k8s.py

      - name: Validar docker-compose.yml
        run: docker compose config -q
