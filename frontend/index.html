<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calles Seguras Juárez</title>
    <meta name="description" content="Consulta y reporta baches, alcantarillas sin tapa y encharcamientos en Ciudad Juárez, Chihuahua, y revisa tu zona antes de salir." />
    <meta name="theme-color" content="#f3f5f9" />
    <script>
      /* Aplica el tema antes del primer pintado para evitar parpadeo (FOUC). */
      (function () {
        var tema = 'light';
        try {
          var guardado = localStorage.getItem('csj-theme');
          tema = guardado === 'dark' || guardado === 'light' ? guardado : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', tema);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', tema === 'dark' ? '#0b1120' : '#f3f5f9');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
