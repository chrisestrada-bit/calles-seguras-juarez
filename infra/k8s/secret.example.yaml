# PLANTILLA DE SECRETOS — todos los valores son FICTICIOS. No es el Secret que usa el despliegue.
#
# Este archivo crea un Secret llamado `calles-seguras-secretos-ejemplo`, que ningún Deployment referencia, para que
# `kubectl apply -f infra/k8s/` nunca sustituya tus secretos reales por estos valores de ejemplo.
#
# Los Deployments leen el Secret `calles-seguras-secretos`. Créalo con valores propios (recomendado, sin escribir
# archivos con secretos):
#
#   kubectl -n calles-seguras create secret generic calles-seguras-secretos \
#     --from-literal=POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" \
#     --from-literal=JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
#     --from-literal=SEED_PASSWORD='ElijeUna2026' \
#     --from-literal=GEOCODING_API_KEY=''
#
# O copia este archivo como `secret.yaml` (está en .gitignore), cambia el `name` a `calles-seguras-secretos`,
# reemplaza TODOS los valores y aplícalo con `kubectl apply -f infra/k8s/secret.yaml`.
#
# Reglas: POSTGRES_PASSWORD debe ser apta para una URL (sin @ : / ? # %; usa token_urlsafe). SEED_PASSWORD: mínimo
# 8 caracteres con letras y números. JWT_SECRET_KEY: al menos 32 caracteres aleatorios (con APP_ENV=production el
# backend no arranca con una clave de ejemplo).
apiVersion: v1
kind: Secret
metadata:
  name: calles-seguras-secretos-ejemplo
  namespace: calles-seguras
  labels:
    app.kubernetes.io/part-of: calles-seguras-juarez
type: Opaque
stringData:
  POSTGRES_PASSWORD: CAMBIAR-por-una-contrasena-larga-y-aleatoria
  JWT_SECRET_KEY: CAMBIAR-por-una-clave-aleatoria-de-64-caracteres-valor-ficticio
  SEED_PASSWORD: CambiarEsto2026
  # Opcional: llave de LocationIQ. Vacía = el buscador usa el catálogo local de colonias.
  GEOCODING_API_KEY: ""
