# API FastAPI. Una sola réplica: el canal WebSocket de encharcamientos en vivo (HU-08.3) mantiene su gestor de
# conexiones en memoria del proceso; con varias réplicas haría falta un bus (p. ej. Redis Pub/Sub). Ver docs/kubernetes.md.
#
# Imagen: `calles-seguras-backend:local`, construida desde la raíz del repo y cargada al clúster (docs/kubernetes.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: calles-seguras
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: calles-seguras-juarez
spec:
  replicas: 1
  strategy:
    type: Recreate # el volumen de fotos es ReadWriteOnce
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: calles-seguras-juarez
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # usuario `api` de backend/Dockerfile
        runAsGroup: 10001
        fsGroup: 10001 # el volumen de fotos queda escribible para ese usuario
      # No arranca la API hasta que PostgreSQL acepte conexiones (el comando de abajo migra al iniciar).
      initContainers:
        - name: esperar-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo 'esperando a PostgreSQL…'; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: backend
          image: calles-seguras-backend:local
          imagePullPolicy: IfNotPresent
          # 1) migraciones  2) datos semilla (idempotentes, sólo si RUN_SEED=true)  3) API
          command:
            - sh
            - -c
            - |
              set -e
              alembic -c db/alembic.ini upgrade head
              if [ "$RUN_SEED" = "true" ]; then python db/seed.py; fi
              exec uvicorn app.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: calles-seguras-config
          env:
            # Se declaran aquí (además de envFrom) para que $(POSTGRES_*) en DATABASE_URL se resuelva siempre.
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: calles-seguras-config, key: POSTGRES_USER } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: calles-seguras-config, key: POSTGRES_DB } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: calles-seguras-secretos, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: calles-seguras-secretos, key: JWT_SECRET_KEY } }
            - name: SEED_PASSWORD
              valueFrom: { secretKeyRef: { name: calles-seguras-secretos, key: SEED_PASSWORD } }
            - name: GEOCODING_API_KEY
              valueFrom: { secretKeyRef: { name: calles-seguras-secretos, key: GEOCODING_API_KEY, optional: true } }
            # $(VAR) se resuelve con las variables definidas ANTES en esta lista y en envFrom.
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          volumeMounts:
            - name: fotos
              mountPath: /srv/uploads
          # La primera vez corren migraciones y semilla (hasta ~1-2 min): el arranque tiene margen amplio.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
      volumes:
        - name: fotos
          persistentVolumeClaim:
            claimName: backend-fotos
