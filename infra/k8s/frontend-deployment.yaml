# Frontend estático (React compilado) servido por Nginx. Sin estado: se puede escalar libremente.
#
# Imagen: `calles-seguras-frontend:local`. La URL de la API se incrusta al COMPILAR (ARG VITE_API_BASE_URL de
# frontend/Dockerfile), no en ejecución: construye la imagen con la URL con la que el NAVEGADOR llegará a la API
# (docs/kubernetes.md). Nunca pongas secretos en variables VITE_.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: calles-seguras
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: calles-seguras-juarez
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: calles-seguras-juarez
    spec:
      containers:
        - name: frontend
          image: calles-seguras-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
