# Calles Seguras Juárez — PostgreSQL + API + frontend con un solo comando:
#
#   docker compose up --build
#
# Las variables se leen de .env (copia .env.example como .env para personalizarlas). Si no existe,
# se usan los valores ficticios de desarrollo indicados aquí. NUNCA uses estos valores en producción.
name: calles-seguras-juarez

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calles_seguras}
      POSTGRES_USER: ${POSTGRES_USER:-csj_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_contrasena_local}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" # sólo accesible desde esta máquina
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Ciudad_Juarez}
      # Dentro de la red de Docker el host de la base de datos siempre es `db`.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-csj_app}:${POSTGRES_PASSWORD:-cambia_esta_contrasena_local}@db:5432/${POSTGRES_DB:-calles_seguras}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-valor-ficticio-solo-desarrollo-reemplazar-en-produccion}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # Único origen permitido por CORS: debe coincidir con el puerto publicado del servicio frontend.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.open-meteo.com/v1/forecast}
      WEATHER_CACHE_TTL_MINUTES: ${WEATHER_CACHE_TTL_MINUTES:-30}
      WEATHER_TIMEOUT_SECONDS: ${WEATHER_TIMEOUT_SECONDS:-5}
      # Geocodificación: la llave sólo existe en este contenedor (nunca en el frontend).
      GEOCODING_API_URL: ${GEOCODING_API_URL:-https://us1.locationiq.com/v1}
      GEOCODING_API_KEY: ${GEOCODING_API_KEY:-}
      GEOCODING_TIMEOUT_SECONDS: ${GEOCODING_TIMEOUT_SECONDS:-5}
      # HU-04.6: servicio de rutas (sólo backend).
      ROUTING_API_URL: ${ROUTING_API_URL:-https://router.project-osrm.org}
      ROUTING_TIMEOUT_SECONDS: ${ROUTING_TIMEOUT_SECONDS:-6}
      # HU-02.4: fotografías de reportes en un volumen persistente (sobreviven a recrear el contenedor).
      UPLOADS_DIR: /srv/uploads
      SEED_PASSWORD: ${SEED_PASSWORD:-Juarez2026}
      RUN_SEED: ${RUN_SEED:-true}
    # 1) migraciones  2) datos semilla (idempotentes)  3) API
    command:
      - sh
      - -c
      - |
        set -e
        alembic -c db/alembic.ini upgrade head
        if [ "$${RUN_SEED}" = "true" ]; then python db/seed.py; fi
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - uploads:/srv/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # El navegador llama a la API desde la máquina anfitriona, por eso es localhost y no `backend`.
        # Sin /api/v1: el cliente ya lo antepone a cada ruta.
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
  uploads:
